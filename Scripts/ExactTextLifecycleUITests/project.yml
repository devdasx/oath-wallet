name: ExactTextLifecycleFixture
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
targets:
  ExactTextLifecycleFixture:
    type: application
    platform: iOS
    sources:
      - App
      - ../../Oath/Components/WalletExactText.swift
      - ../../Oath/Components/WalletTextWrapping.swift
      - ../../Oath/Components/WalletNativeTextPrivacy.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aperture.exact-text-lifecycle-fixture
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  ExactTextLifecycleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests
    dependencies:
      - target: ExactTextLifecycleFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aperture.exact-text-lifecycle-fixture.uitests
schemes:
  ExactTextLifecycleFixture:
    build:
      targets:
        ExactTextLifecycleFixture: all
        ExactTextLifecycleUITests: [test]
    test:
      targets: [ExactTextLifecycleUITests]
      captureScreenshotsAutomatically: false
