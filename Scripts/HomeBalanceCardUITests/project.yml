name: HomeBalanceCardFixture
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
targets:
  HomeBalanceCardFixture:
    type: application
    platform: iOS
    info:
      path: App/Info.plist
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    sources:
      - path: App
        excludes: [Info.plist]
      - path: ../../Oath/WalletManagement/WalletAppearanceColor.swift
      - path: ../../Oath/Home/WalletHomeBalanceCard.swift
      - path: ../../Oath/Home/WalletHomeBalanceCardStyle.swift
      - path: ../../Oath/Home/WalletAnimatedCurrencyBalance.swift
      - path: ../../Oath/en.lproj/Localizable.strings
        buildPhase: resources
      - path: ../../Oath/ar.lproj/Localizable.strings
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.aperture.home-balance-card-fixture
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  HomeBalanceCardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests
    dependencies:
      - target: HomeBalanceCardFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aperture.home-balance-card-fixture.uitests
schemes:
  HomeBalanceCardFixture:
    build:
      targets:
        HomeBalanceCardFixture: all
        HomeBalanceCardUITests: [test]
    test:
      targets: [HomeBalanceCardUITests]
      captureScreenshotsAutomatically: false
      preferredScreenCaptureFormat: screenshots
