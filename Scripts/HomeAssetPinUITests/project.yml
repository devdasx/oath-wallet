name: HomeAssetPinFixture
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
targets:
  HomeAssetPinFixture:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../../EVMWallet/Home/WalletHomeAssetPinAction.swift
      - path: ../../EVMWallet/Home/WalletHomeSwipeCompletion.swift
      - path: ../../EVMWallet/en.lproj/Localizable.strings
        buildPhase: resources
      - path: ../../EVMWallet/ar.lproj/Localizable.strings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aperture.home-asset-pin-fixture
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  HomeAssetPinUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests
    dependencies:
      - target: HomeAssetPinFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aperture.home-asset-pin-fixture.uitests
schemes:
  HomeAssetPinFixture:
    build:
      targets:
        HomeAssetPinFixture: all
        HomeAssetPinUITests: [test]
    test:
      targets: [HomeAssetPinUITests]
      captureScreenshotsAutomatically: false
      preferredScreenCaptureFormat: screenshots
