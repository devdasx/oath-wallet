name: RecoveryPhraseDeleteFixture
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
targets:
  RecoveryPhraseDeleteFixture:
    type: application
    platform: iOS
    sources:
      - App
      - ../../Oath/Components/RecoveryPhraseEditor.swift
      - ../../Oath/Components/RecoveryPhraseEditorState.swift
      - ../../Oath/Components/RecoveryPhraseInlineInput.swift
      - ../../Oath/Components/RecoveryPhraseWordLayout.swift
      - ../../Oath/Components/RecoveryPhraseWordLabel.swift
      - ../../Oath/WalletTextInputReturnKey.swift
      - ../../Oath/WalletTextInputDirection.swift
      - ../../Oath/Components/WalletTextWrapping.swift
      - path: ../../Oath/en.lproj/Localizable.strings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aperture.recovery-delete-fixture
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  RecoveryPhraseDeleteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests
    dependencies:
      - target: RecoveryPhraseDeleteFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aperture.recovery-delete-fixture.uitests
schemes:
  RecoveryPhraseDeleteFixture:
    build:
      targets:
        RecoveryPhraseDeleteFixture: all
        RecoveryPhraseDeleteUITests: [test]
    test:
      targets: [RecoveryPhraseDeleteUITests]
      captureScreenshotsAutomatically: false
