name: KeyboardReturnFixture
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
targets:
  KeyboardReturnFixture:
    type: application
    platform: iOS
    sources:
      - App
      # Compile the production policy, not a copied or simplified substitute.
      - ../../EVMWallet/WalletTextInputDirection.swift
      - ../../EVMWallet/WalletTextInputReturnKey.swift
      - path: ../../EVMWallet/en.lproj/Localizable.strings
        buildPhase: resources
      - path: ../../EVMWallet/ar.lproj/Localizable.strings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aperture.keyboard-return-fixture
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  KeyboardReturnUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests
    dependencies:
      - target: KeyboardReturnFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aperture.keyboard-return-fixture.uitests
schemes:
  KeyboardReturnFixture:
    build:
      targets:
        KeyboardReturnFixture: all
        KeyboardReturnUITests: [test]
    test:
      targets: [KeyboardReturnUITests]
      captureScreenshotsAutomatically: false
      preferredScreenCaptureFormat: screenshots
