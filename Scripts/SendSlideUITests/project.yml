name: SendSlideFixture
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: ""
targets:
  SendSlideFixture:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../../Oath/Send/SendSlideControl.swift
      - path: ../../Oath/Send/SendSlideCompletionCheckmark.swift
      - path: ../../Oath/Send/SendSlideLabel.swift
      - path: ../../Oath/Send/SendSlideGuidanceCycle.swift
      - path: ../../Oath/Send/SendSlideShimmerRenderer.swift
      - path: ../../Oath/Send/SendSlideGesture.swift
      - path: ../../Oath/Send/SendSlideDragTracking.swift
      - path: ../../Oath/Send/SendSlideTrack.swift
      - path: ../../Oath/Send/SendSlideDirectionIndicator.swift
      - path: ../../Oath/UniHaptic.swift
      - path: ../../Oath/UniHapticActionFeedback.swift
      - path: ../../Oath/en.lproj/Localizable.strings
        buildPhase: resources
      - path: ../../Oath/ar.lproj/Localizable.strings
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aperture.send-slide-fixture
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Test slider confirmation during Face ID."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  SendSlideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests
    dependencies:
      - target: SendSlideFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aperture.send-slide-fixture.uitests
  SendSlideLayoutTests:
    type: bundle.unit-test
    platform: iOS
    sources: LayoutTests
    dependencies:
      - target: SendSlideFixture
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aperture.send-slide-fixture.layout-tests
schemes:
  SendSlideFixture:
    build:
      targets:
        SendSlideFixture: all
        SendSlideUITests: [test]
        SendSlideLayoutTests: [test]
    test:
      targets: [SendSlideUITests, SendSlideLayoutTests]
      captureScreenshotsAutomatically: false
      preferredScreenCaptureFormat: screenshots
