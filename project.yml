name: OathAtmosphere
options:
  developmentLanguage: en
  bundleIdPrefix: org.oathwallet
  xcodeVersion: '27.0'
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '4.0.3'
    CURRENT_PROJECT_VERSION: '77'
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  Reown:
    path: Vendor/Reown
  OathSecp256k1:
    path: Packages/OathSecp256k1
  OathDiagnostics:
    path: Packages/OathDiagnostics
  OathTokenImages:
    path: Packages/OathTokenImages
  OathBitcoin:
    path: Packages/OathBitcoin
  OathMarketData:
    path: Packages/OathMarketData
  OathExchangeRates:
    path: Packages/OathExchangeRates
  OathCloudBackup:
    path: Packages/OathCloudBackup
  OathNativeLock:
    path: Packages/OathNativeLock
  OathDatabase:
    path: Packages/OathDatabase
  OathNativeRefresh:
    path: Packages/OathNativeRefresh
  WalletCore:
    path: Packages/WalletCore
targets:
  OathAtmosphere:
    type: application
    platform: iOS
    info:
      path: OathApp/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleName: Oath Wallet
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.aperture.wallet.walletconnect
            CFBundleURLSchemes: [oathwallet]
        OathWalletConnectKeychainGroup: '$(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleLocalizations: [en, zh-Hans, hi, es, fr, ar, bn, pt-BR, pt-PT, ru, ur, id, ms, de, ja, sw, mr, te, tr, ta, zh-Hant, vi, ko, fa, ha, th, gu, pa, fil, it, pl, uk, ml, kn, or, my, nl, ro, am, uz, sd, yo, ne, si, km, cs, sk, sl, hr, ka, el, sv, hu, he, da, fi, nb]
        # Product requirement: portrait only on every supported device.
        # Never add landscape or an orientation-unrestricted device override.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [org.oathwallet.send-status]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSUbiquitousContainers:
          iCloud.com.aperture.wallet:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Oath Wallet
            NSUbiquitousContainerSupportedFolderLevels: Any
        UIAppFonts:
          - IBMPlexSansArabic-Regular.ttf
          - IBMPlexSansArabic-Medium.ttf
          - IBMPlexSansArabic-SemiBold.ttf
          - IBMPlexSansArabic-Bold.ttf
    sources:
      - path: OathApp
        excludes: [Private]
      - OathAtmosphere
      - Shaders
    postBuildScripts:
      - name: Copy local token RPC configuration
        script: '/bin/sh "${SRCROOT}/Tools/CopyTokenRPC.sh"'
        inputFiles:
          - '$(SRCROOT)/OathApp/Private/TokenRPC.plist'
          - '$(SRCROOT)/Tools/CopyTokenRPC.sh'
        outputFiles:
          - '$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/TokenRPC.plist'
        basedOnDependencyAnalysis: false
        showEnvVars: false
    dependencies:
      - package: Reown
        product: WalletConnect
      - package: Reown
        product: WalletConnectNetworking
      - package: OathSecp256k1
        embed: true
      - package: OathDiagnostics
        embed: true
      - package: OathBitcoin
        embed: true
      - package: OathTokenImages
      - package: OathMarketData
      - package: OathExchangeRates
      - package: OathCloudBackup
      - package: OathNativeLock
      - package: OathDatabase
      - package: OathNativeRefresh
      - package: WalletCore
        product: WalletCore
      - package: WalletCore
        product: WalletCoreSwiftProtobuf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aperture.wallet
        CODE_SIGN_ENTITLEMENTS: OathApp/OathAtmosphere.entitlements
        PRODUCT_NAME: Oath Wallet
        PRODUCT_MODULE_NAME: OathAtmosphere
        EXECUTABLE_NAME: OathAtmosphere
        # This target has no AppIntents/Shortcuts. Re-enable extraction if added.
        LM_SKIP_METADATA_EXTRACTION: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: 'AppIconObsidian AppIconPorcelain AppIconVerdant AppIconUltraviolet AppIconElectricLime AppIconEmber AppIconTitanium AppIconGlacier AppIconChampagne'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Oath Wallet
        INFOPLIST_KEY_NSFaceIDUsageDescription: 'Use Face ID for quick, secure access to your wallet.'
        INFOPLIST_KEY_NSCameraUsageDescription: 'Scan wallet addresses, recovery phrases and WalletConnect QR codes.'
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarHidden: NO
        INFOPLIST_KEY_UIViewControllerBasedStatusBarAppearance: YES
        INFOPLIST_KEY_CADisableMinimumFrameDurationOnPhone: YES
  OathPasscodeNavigationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: OathAtmosphere
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.oathwallet.atmosphere.navigationtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OathAtmosphere
  OathLocalizationTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LocalizationTests]
    dependencies:
      - target: OathAtmosphere
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.oathwallet.atmosphere.localizationtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: '$(BUILT_PRODUCTS_DIR)/Oath Wallet.app/OathAtmosphere'
        BUNDLE_LOADER: '$(TEST_HOST)'
schemes:
  OathAtmosphere:
    build:
      targets:
        OathAtmosphere: all
    run:
      config: Debug
    test:
      targets:
        - OathPasscodeNavigationUITests
        - OathLocalizationTests
  OathWalletConnectValidation:
    build:
      targets:
        OathAtmosphere: all
    run:
      config: Debug
    test:
      targets:
        - name: OathPasscodeNavigationUITests
          selectedTests:
            - OathWalletConnectVisualUITests
  OathWalletConnectLiveValidation:
    build:
      targets:
        OathAtmosphere: all
    run:
      config: Debug
    test:
      targets:
        - name: OathPasscodeNavigationUITests
          selectedTests:
            - OathWalletConnectLiveUITests
