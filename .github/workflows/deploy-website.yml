name: Deploy website
on:
  push:
    branches: [main]
    paths: ['Website/**', '.github/workflows/deploy-website.yml', '.github/workflows/website-checks.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: website-production
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/website-checks.yml
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    environment: production-website
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - name: Check deployment access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure the Cloudflare deployment secret before deploying.'; exit 1; }
      - run: npm ci
      - name: Publish all website hosts from this commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
      - name: Verify production pages and links
        run: python3 scripts/audit-search.py /tmp/oath-search-audit.json
      - name: Verify Git-owned help content
        run: node scripts/verify-live-deployment.mjs
      - name: Verify public search crawler access on all three hosts
        run: python3 scripts/check-search-crawlers.py
      - name: Verify every public document and agent workflow
        run: node scripts/check-agent-access.mjs
