name: Deploy website
on:
  push:
    branches: [main]
    paths: ['Website/**', '.github/workflows/deploy-website.yml', '.github/workflows/website-checks.yml']
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: website-production
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/website-checks.yml
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-24.04
    environment: production-website
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - name: Check deployment access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure the Cloudflare deployment secret before deploying.'; exit 1; }
      - run: npm ci
      - name: Restore successful search notification state
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: Website/.search-state/indexnow-hashes.json
          key: indexnow-production-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-production-v2-
      - name: Publish all website hosts from this commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy
      - name: Wait for the deployed catalog and verify Git-owned content
        run: |
          # Edge locations can briefly serve the preceding Worker during rollout.
          # Every attempt still requires the exact manifest/version and all checks.
          for attempt in 1 2 3 4 5; do
            if node scripts/verify-live-deployment.mjs; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then sleep 15; fi
          done
          exit 1
      - name: Verify production pages and links
        run: python3 scripts/audit-search.py /tmp/oath-search-audit.json
      - name: Verify public search crawler access on all three hosts
        run: python3 scripts/check-search-crawlers.py
      - name: Verify every public document and agent workflow
        run: node scripts/check-agent-access.mjs
      - name: Notify IndexNow about changes on all three verified hosts
        run: npm run notify:search
