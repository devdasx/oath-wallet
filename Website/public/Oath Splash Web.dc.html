<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template data-oath-template>
<x-dc>
<sc-if value="{{ show }}" hint-placeholder-val="{{ true }}">
  <div aria-hidden="true" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#0A0A0B;opacity:{{ coverO }};transition:{{ coverTr }};pointer-events:{{ pe }}">
    <img src="{{ mark }}" alt="" style="display:block;width:128px;height:86px;transform:{{ markT }};opacity:{{ markO }};transition:{{ markTr }};will-change:transform,opacity" role="presentation">
  </div>
</sc-if>
</x-dc>
</template>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:600},&quot;always&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  // Plays once per browser session; set the `always` prop to preview it on every load.
  state = {
    phase: (() => { try { return !this.props?.always && sessionStorage.getItem('oathSplash') ? 4 : 0; } catch (e) { return 0; } })(),
    ready: typeof window !== 'undefined' && !!window.OathIcons,
  };

  componentDidMount() {
    const tick = () => { if (window.OathIcons) this.setState({ ready: true }); else this._t = setTimeout(tick, 30); };
    if (!this.state.ready) tick();
    if (this.state.phase === 4 && !this.props.always) return;
    try { sessionStorage.setItem('oathSplash', '1'); } catch (e) {}
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const at = (ms, phase) => setTimeout(() => this.setState({ phase }), ms);
    this._q = reduce ? [at(350, 9), at(700, 4)] : [at(350, 1), at(650, 2), at(1250, 4)];
    document.documentElement.style.overflow = 'hidden';
    this._q.push(setTimeout(() => { document.documentElement.style.overflow = ''; }, reduce ? 700 : 1100));
  }
  componentWillUnmount() { clearTimeout(this._t); (this._q || []).forEach(clearTimeout); document.documentElement.style.overflow = ''; }

  renderVals() {
    const I = this.state.ready && window.OathIcons;
    const p = this.state.phase;
    const reduced = p === 9;
    const spring = 'cubic-bezier(.2,.9,.25,1)';
    return {
      show: p !== 4,
      mark: I ? I.url(I.build('vow', 'dark', { palette: 'Prism', glow: 1.3, lights: 'Four', mark: true })) : 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%2F%3E',
      markT: reduced ? 'scale(1)' : p === 1 ? 'scale(.9)' : p >= 2 ? 'scale(8)' : 'scale(1)',
      markO: reduced || p >= 2 ? 0 : 1,
      markTr: reduced ? 'opacity .3s ease' : p === 1 ? `transform .3s ${spring}` : p >= 2 ? 'transform .5s cubic-bezier(.5,0,.75,0), opacity .35s ease .12s' : 'none',
      coverO: reduced || p >= 2 ? 0 : 1,
      coverTr: reduced ? 'opacity .3s ease' : p >= 2 ? 'opacity .45s ease .1s' : 'none',
      pe: p >= 2 || reduced ? 'none' : 'auto',
    };
  }
}
</script>
</body>
</html>
