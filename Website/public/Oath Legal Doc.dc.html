<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<template data-oath-template>
<x-dc>
<section data-screen-label="Legal document" style="max-width:1320px;margin:0 auto;padding:clamp(120px,17vw,170px) clamp(20px,5vw,32px) clamp(96px,12vw,140px);color:#F2F0EA">
  <span style="font:400 12.5px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#8E8C86">Legal</span>
  <h1 style="margin:24px 0 0;font:400 clamp(52px,9vw,148px)/.9 'Instrument Serif',serif;letter-spacing:-.025em">{{ d.title }} <em style="color:#8E8C86">{{ d.titleEm }}</em></h1>
  <div style="margin-top:clamp(28px,4vw,40px);display:flex;flex-wrap:wrap;gap:10px 28px;font:400 13px/1.4 'IBM Plex Mono',monospace;color:#8E8C86">
    <span>Last updated · {{ d.updated }}</span><span>Effective · {{ d.updated }}</span><span>{{ readTime }}</span>
  </div>

  <div style="margin-top:clamp(40px,6vw,64px);border-radius:clamp(22px,3vw,28px);background:#F2F0EA;color:#0A0A0B;padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:14px">
    <span style="font:400 12px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#5E5C57">In short</span>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px 28px">
      <sc-for list="{{ d.summary }}" as="s" hint-placeholder-count="3">
        <div style="display:flex;gap:12px;align-items:flex-start"><span style="flex:none;width:22px;height:22px;margin-top:2px;border-radius:50%;background:#0A0A0B;color:#F2F0EA;display:flex;align-items:center;justify-content:center;font:600 11px/1 'Instrument Sans',sans-serif">✓</span><span style="font:400 clamp(19px,1.8vw,23px)/1.3 'Instrument Serif',serif">{{ s }}</span></div>
      </sc-for>
    </div>
  </div>

  <div style="margin-top:clamp(56px,8vw,96px);display:grid;grid-template-columns:{{ cols }};gap:clamp(32px,5vw,80px);align-items:start">
    <nav style="position:{{ navPos }};top:110px;display:flex;flex-direction:column;border-top:1px solid rgba(242,240,234,.12)">
      <span style="padding:16px 0 10px;font:400 12px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:#8E8C86">Contents</span>
      <sc-for list="{{ toc }}" as="t" hint-placeholder-count="10">
        <a href="{{ t.href }}" style="display:flex;gap:12px;padding:9px 0;font:400 15px/1.35 'Instrument Sans',sans-serif;color:{{ t.c }};transition:color .3s" style-hover="color:#FFFFFF"><span style="flex:none;width:22px;font:400 12px/1.6 'IBM Plex Mono',monospace;color:#6E6C67">{{ t.n }}</span>{{ t.t }}</a>
      </sc-for>
    </nav>
    <article style="display:flex;flex-direction:column;max-width:760px">
      <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="8">
        <div id="{{ sec.id }}" style="scroll-margin-top:100px;padding:36px 0;border-top:1px solid rgba(242,240,234,.12);display:flex;flex-direction:column;gap:16px">
          <div style="display:flex;align-items:baseline;gap:16px"><span style="font:400 13px/1 'IBM Plex Mono',monospace;color:#8E8C86">{{ sec.n }}</span><h2 style="margin:0;font:400 clamp(28px,3vw,40px)/1.1 'Instrument Serif',serif;letter-spacing:-.015em">{{ sec.t }}</h2></div>
          <sc-for list="{{ sec.p }}" as="para" hint-placeholder-count="2">
            <p style="margin:0;font:400 17px/1.7 'Instrument Sans',sans-serif;color:#C9C7C0;text-wrap:pretty">{{ para }}</p>
          </sc-for>
          <sc-if value="{{ sec.hasList }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;gap:10px;padding-left:4px">
              <sc-for list="{{ sec.list }}" as="li" hint-placeholder-count="3">
                <div style="display:flex;gap:14px;font:400 17px/1.6 'Instrument Sans',sans-serif;color:#C9C7C0"><span style="flex:none;margin-top:11px;width:6px;height:6px;border-radius:50%;background:#8E8C86"></span><span>{{ li }}</span></div>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
      <div style="padding:36px 0 0;border-top:1px solid rgba(242,240,234,.12);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px">
        <span style="font:400 clamp(22px,2.4vw,30px)/1.2 'Instrument Serif',serif">Questions about this policy?</span>
        <a href="mailto:care@oathwallet.org" style="height:50px;padding:0 22px;border-radius:999px;background:#F2F0EA;color:#0A0A0B;display:flex;align-items:center;font:600 15px/1 'Instrument Sans',sans-serif">care@oathwallet.org</a>
      </div>
    </article>
  </div>
</section>
</x-dc>
</template>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:1400},&quot;doc&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;terms&quot;,&quot;privacy&quot;],&quot;default&quot;:&quot;terms&quot;,&quot;tsType&quot;:&quot;'terms' | 'privacy'&quot;}}">
class Component extends DCLogic {
  state = { vw: 1200, active: 0 };
  componentDidMount() {
    this._r = () => this.setState({ vw: window.innerWidth });
    this._s = () => {
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => {
        this._raf = null;
        const ids = this.doc().sections.map((_, k) => 's' + (k + 1));
        let a = 0; ids.forEach((id, k) => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < 160) a = k; });
        if (a !== this.state.active) this.setState({ active: a });
      });
    };
    this._r(); window.addEventListener('resize', this._r); window.addEventListener('scroll', this._s, { passive: true });
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); window.removeEventListener('scroll', this._s); cancelAnimationFrame(this._raf); }

  doc() {
    const CO = 'STAGE AND STYLE COLLECTIVE LLC', ADDR = '2103 Condor Ct, Redmond, Oregon 97756-8281, United States', MAIL = 'care@oathwallet.org';

        ['Your keys, your responsibility', ['Recovery requires the credentials appropriate to your wallet: its recovery words and any required passphrase, private keys, or a supported encrypted backup and its password. You are solely responsible for creating, storing and protecting them.'], ['If you lose every usable recovery method, no one — including us — can restore your wallet.', 'Anyone with your recovery phrase can move your funds. Never share it. Oath will never ask for it.', 'Keep original recovery credentials private and verify the supported import format before relying on recovery.']],
        ['Transactions and fees', ['Transactions are broadcast to public networks that we do not control, and are irreversible once confirmed. Network fees are paid to network participants, not to Oath, and are shown before you confirm.', 'We do not guarantee confirmation times, fee levels, the availability of any network, or the value of any digital asset.']],
        ['Third-party services and EVM Access', ['The Service may display or connect to third-party networks, tokens, price providers and decentralised applications. They are not operated by us and are used at your own risk.', 'EVM Access lets you view and revoke token approvals given to third-party applications. Revoking an approval is an on-chain transaction that costs a network fee.']],
        ['Information, not advice', ['Prices, charts and local-currency values are provided for information only, may be delayed or inaccurate, and are not financial, investment, legal or tax advice. Digital assets are volatile and you may lose some or all of their value.']],

        ['Acceptable use', ['You agree not to use the Service to break any law, including sanctions, anti-money-laundering and counter-terrorist-financing laws; to infringe others’ rights; to distribute malware; or to disrupt the Service or any network.']],

        ['Apple App Store terms', ['If you downloaded Oath from the Apple App Store, the following also apply:'], ['These Terms are between you and ' + CO + ' only, not Apple Inc. (“Apple”). We, not Apple, are solely responsible for the app and its content.', 'Your licence is limited to use on Apple-branded devices you own or control, as permitted by the App Store Usage Rules.', 'Apple has no obligation to provide maintenance or support for the app.', 'If the app fails to conform to any applicable warranty, you may notify Apple and Apple will refund the purchase price (if any). To the maximum extent permitted by law, Apple has no other warranty obligation for the app.', 'We, not Apple, are responsible for addressing any claims relating to the app, including product-liability claims, claims that the app fails to meet legal or regulatory requirements, and consumer-protection or privacy claims.', 'We, not Apple, are responsible for investigating and resolving any claim that the app infringes a third party’s intellectual property rights.', 'Apple and its subsidiaries are third-party beneficiaries of these Terms and may enforce them against you.']],
        ['Your consumer rights', ['Nothing in these Terms limits any rights you have under mandatory consumer-protection laws in your country of residence, which cannot be waived by contract. Where these Terms conflict with such laws, those laws prevail.', 'If you live in the European Union, the United Kingdom or another country with similar laws, you keep your statutory rights, including rights relating to digital content that is not as described.']],
        ['Disclaimers', ['To the maximum extent permitted by applicable law, the Service is provided “as is” and “as available”, without warranties of any kind, whether express or implied, including merchantability, fitness for a particular purpose and non-infringement.']],
        ['Limitation of liability', ['To the maximum extent permitted by applicable law, we are not liable for indirect, incidental, special or consequential damages, or for any loss of digital assets caused by lost or disclosed keys, user error, device compromise, network failures or third-party services.', 'Nothing in these Terms excludes or limits liability that cannot be excluded or limited under applicable law, such as liability for death or personal injury caused by negligence, or for fraud.']],
        ['Termination', ['You may stop using the Service at any time by deleting the app. Because the Service is non-custodial, your wallet and funds remain accessible to you with your recovery phrase even if you stop using Oath. We may suspend or discontinue the Service, or parts of it, where required by law or for security reasons.']],

        ['Disputes', ['If you are a consumer, you benefit from any mandatory provisions of the law of your country of residence, and you may bring proceedings in the courts of your country of residence.', 'Before starting any claim, please contact us at ' + MAIL + ' so we can try to resolve it informally. EU consumers may also use the European Commission’s online dispute-resolution platform.']],
        ['General', ['If any provision of these Terms is found unenforceable, the rest remains in effect. These Terms are the entire agreement between you and us about the Service. We may assign these Terms in connection with a merger or sale; you may not assign them without our consent. We are not liable for delays caused by events beyond our reasonable control. If these Terms are translated, the English version prevails to the extent permitted by law.']],

    const PRIVACY = {

      "summary": [

            "This Privacy Policy explains how STAGE AND STYLE COLLECTIVE LLC, 2103 Condor Ct, Redmond, Oregon 97756-8281, United States (“Oath”, “we”, “us”) handles personal data when you use Oath Wallet distributed through the App Store and the Oath website (the “Service”). We are the data controller for the limited personal data described here.",

          ],
          []
        ],
        [
          "Our approach",
          [
            "The App Store app does not collect user analytics or automatically upload error reports. Network requests, optional services, website visits and information you choose to send us are described separately below. We do not require an account, name, email address, phone number or identity documents to use the wallet app or browse the website. The optional newsletter requires an email address."
          ],

          ],
          []
        ],
        [
          "Password-encrypted backup and WalletConnect",
          [
            "Optional iCloud backup encrypts an eligible wallet on the device with AES-256-GCM. Its key is derived from a separate backup password using PBKDF2-HMAC-SHA256 with 600,000 rounds and a fresh salt. Restore requires both the encrypted backup file and its backup password. Oath does not receive the password or a plaintext backup. Apple operates iCloud Drive under its own policies.",

          ],
          []
        ],
        [

          [

          ]
        ],
        [
          "Notification services in earlier releases",
          [
            "The 4.1.14 public source does not register wallet addresses or notification tokens with an operator notification service. Earlier releases and separately enabled services may have registered public wallet information, notification tokens and device metadata. Contact us about data you previously supplied to those services; updating the app alone does not delete earlier service records."
          ],
          []
        ],
        [
          "Website visitor statistics",
          [
            "On oathwallet.org, we use first-party website analytics to understand visits and App Store download-button clicks. A random, first-party browser identifier is stored in a Secure, HttpOnly cookie for up to one year. Session information in your browser groups activity into visits after 30 minutes of inactivity. We record page paths (not query strings), referral domains (not full referral URLs), broad browser/device categories, and approximate country/city and rounded coordinates derived by Cloudflare from your IP address. This is not GPS location and does not request device-location access. Our analytics records do not store your raw IP address or link visits to wallet data.",
            "Restricted administrators can view statistics, anonymous returning-browser history, and visit/download alerts in the restricted administration console. Detailed events are retained for up to 400 days. Clearing the cookie creates a new anonymous browser identity. We exclude detected automated traffic and honour Global Privacy Control and Do Not Track signals. You can enable those browser settings to opt out of this website analytics. Download clicks are not evidence of app installation."
          ],
          []
        ],
        [
          "Optional Oath Notes newsletter",
          [
            "If you choose to subscribe, we store your email address, selected topics, signup source page, consent version and timestamps, subscription status and signup method, and subscription changes to provide the newsletter. Newsletter signup is optional and is not connected to wallet addresses, balances, recovery phrases, or private keys. Submitting the signup form subscribes you immediately; no email confirmation is required. Emails may include Oath Wallet releases, crypto news and market prices, security alerts, and practical guides.",
            "Our email delivery provider processes the recipient address and message content. We record sending, delivery, bounce, complaint, and unsubscribe events. When engagement measurement is enabled for a campaign, tracking pixels and redirect links can report opens and clicks. These are approximate signals: email privacy services and security scanners may create events without a person reading or clicking. We do not store the IP addresses or user-agent strings received in newsletter event reports.",
            "You can change topics or unsubscribe using the private link in an email. Unsubscribed addresses and permanent delivery failures are suppressed from future campaigns. We retain subscription and consent records while needed to deliver the newsletter, honour opt-outs, and resolve delivery or abuse issues. Contact care@oathwallet.org to request access or deletion; a minimal suppression record may be retained to prevent future unwanted messages.",
            "The website remembers that the signup dialog appeared using browser local storage and a preference cookie (up to 400 days). This preference does not identify you and is not linked to subscriber records. It stops repeated prompts in that browser. Clearing browser storage, private browsing, or using another device can show the dialog again. Short-lived, keyed IP hashes help limit automated signup and login attempts; raw IP addresses are not saved in the newsletter database."
          ],
          []
        ],
        [

          ],

          ]
        ],
        [

            "We may use a small number of service providers (such as blockchain node providers, price-data providers, hosting and email providers) who process data on our behalf under written contracts that require confidentiality and security. We may disclose information where required by law or to protect rights and safety, and we will resist over-broad requests where the law allows."
          ],

        ],
        [

            "Our providers may process data in countries other than yours. Where required, we protect transfers with appropriate safeguards such as the European Commission’s Standard Contractual Clauses, the UK International Data Transfer Addendum, or other lawful transfer mechanisms."

            "Japan — APPI · South Korea — PIPA · Singapore — PDPA · Thailand — PDPA",
            "India — Digital Personal Data Protection Act 2023",

        ],

    return (this.props.doc ?? 'terms') === 'privacy' ? PRIVACY : TERMS;
  }

  renderVals() {
    const d = this.doc(), narrow = this.state.vw < 900;
    const words = d.sections.reduce((n, s) => n + (s[1].join(' ') + ' ' + (s[2] || []).join(' ')).split(/\s+/).length, 0);
    return {
      d,
      readTime: Math.max(1, Math.round(words / 220)) + ' min read',
      cols: narrow ? 'minmax(0,1fr)' : 'minmax(0,260px) minmax(0,1fr)',
      navPos: narrow ? 'static' : 'sticky',
      toc: d.sections.map((s, k) => ({ n: String(k + 1).padStart(2, '0'), t: s[0], href: '#s' + (k + 1), c: k === this.state.active ? '#F2F0EA' : '#8E8C86' })),
      sections: d.sections.map((s, k) => ({ id: 's' + (k + 1), n: String(k + 1).padStart(2, '0'), t: s[0], p: s[1], list: s[2] || [], hasList: !!(s[2] && s[2].length) })),
    };
  }
}
</script>
</body>
</html>
